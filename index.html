<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator AlphaCode_Project </title>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
</head>
<body>
    <div class="Main-Container">
        <div class="InputsContainer shadow-lg">
            <form>
                <div class="DisplayCont">
                    <input type="text" name="DisplayBar" class="ResultCont">
                </div>
                <div>
                    <input style=color:green;font-weight:bold; type="button" value="AC" onclick="DisplayBar.value = ''">
                    <input style=color:red;font-weight:bold; type="button" value="DE" onclick="DisplayBar.value = DisplayBar.value.toString().slice(0,-1)">
                    <input type="button" value="."  onclick="DisplayBar.value += '.'">
                    <input type="button" value="/" onclick="DisplayBar.value += '/'">
                </div>
                <div>
                    <input type="button" value="7" onclick="DisplayBar.value += '7'">
                    <input type="button" value="8" onclick="DisplayBar.value += '8'">
                    <input type="button" value="9" onclick="DisplayBar.value += '9'">
                    <input type="button" value="*" onclick="DisplayBar.value += '*'">
                </div>
                <div>
                    <input type="button" value="4" onclick="DisplayBar.value += '4'">
                    <input type="button" value="5" onclick="DisplayBar.value += '5'">
                    <input type="button" value="6" onclick="DisplayBar.value += '6'">
                    <input type="button" value="-" onclick="DisplayBar.value += '-'">
                </div>
                <div>
                    <input type="button" value="1" onclick="DisplayBar.value += '1'">
                    <input type="button" value="2" onclick="DisplayBar.value += '2'">
                    <input type="button" value="3" onclick="DisplayBar.value += '3'">
                    <input type="button" value="+" onclick="DisplayBar.value += '+'">
                </div>
                <div>
                    <input type="button" value="00" onclick="DisplayBar.value += '00'">
                    <input type="button" value="0"  onclick="DisplayBar.value += '0'">
                    <input style=width:170px;font-weight:900;color:green; type="button" value="="  onclick="DisplayBar.value = eval(DisplayBar.value)">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
